name: Release

on:
  push:
    tags:
      - "v*"

# Required by PyPI trusted publishing (OIDC).
permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Check that the tag matches pyproject version
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag v${TAG} does not match pyproject.toml version ${PKG_VERSION}"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Pin the deployment to a GitHub Environment so PyPI trusted
    # publishing can be scoped to it. Configure this environment in
    # the repo settings (Settings -> Environments -> New environment
    # named 'pypi') and add it to the PyPI project's trusted
    # publisher list.
    environment:
      name: pypi
      url: https://pypi.org/p/agentchanti
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI via trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
